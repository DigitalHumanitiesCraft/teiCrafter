name: checks

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install Python harness dependency
        run: uv pip install --system "lxml==5.4.0"
      - name: Install pinned Node dependencies
        run: npm ci
      - name: Verify proofs, harness, types, lint, and build
        run: npm run verify
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium firefox
      - name: Run browser E2E and accessibility smoke tests
        run: npm run test:e2e
      - name: Upload deployable Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
