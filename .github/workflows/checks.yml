name: checks

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install Python harness dependency
        run: uv pip install --system "lxml==5.4.0"
      - name: Install pinned Node dependencies
        run: npm ci
      - name: Install Playwright Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox
      - name: Test the source-first core
        run: npm run test:src
      - name: Typecheck the source-first core and prototypes
        run: npm run typecheck:src
      - name: Lint the source-first core and prototypes with Biome
        run: npx biome check --files-ignore-unknown=true src prototypes
      - name: Evaluate proofs, harness, types, build and browser workflows without retries
        run: npm run evaluate:editorial
      - name: Preserve browser verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-verification-${{ github.run_attempt }}
          path: |
            node_modules/.tmp/evaluation/
            test-results/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
      - name: Upload deployable Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
